<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cockpit"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#121318" media="(prefers-color-scheme: dark)"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="apple-touch-icon.png">

<style>
:root{color-scheme:light dark;--bg:#f4f5f7;--card:#fff;--ink:#1b1d22;--soft:#6b7080;--line:#dfe2e8;--acc:#2f5bea;--bad:#c2372f}
@media(prefers-color-scheme:dark){:root{--bg:#121318;--card:#1c1e25;--ink:#e9eaee;--soft:#9aa0ae;--line:#30333d;--acc:#7a9bff;--bad:#ff7b72}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;padding:20px}
.box{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.logo{width:44px;height:44px;margin-bottom:14px}h1{font-size:20px;margin:0 0 4px}p{margin:0 0 18px;color:var(--soft);font-size:13.5px}
label{display:block;font-size:13px;color:var(--soft);margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.rem{display:flex;gap:8px;align-items:center;margin:12px 0 18px;font-size:13.5px;color:var(--ink)}
button{width:100%;font-family:inherit;font-weight:600;font-size:15px;padding:11px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}.err{color:var(--bad);font-size:13px;min-height:1.3em;margin:10px 0 0}
</style></head><body>
